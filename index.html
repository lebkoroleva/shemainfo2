<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЕГЭ тренажёр — Информация</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Nunito;
background:linear-gradient(120deg,#eef2f7,#ffffff);
}

.wrapper{
max-width:900px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
font-family:'Patrick Hand';
font-size:56px;
margin-bottom:10px;
}

.topbar{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.badge{
background:#111;
color:white;
padding:8px 16px;
border-radius:20px;
font-weight:700;
}

.progress{
height:12px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-bottom:25px;
}

.progress-inner{
height:100%;
width:0%;
background:linear-gradient(90deg,#4facfe,#00f2fe);
transition:.3s;
}

.card{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 20px 40px rgba(0,0,0,0.1);
text-align:center;
}

.answers button{
width:100%;
margin:8px 0;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
background:#eee;
transition:.2s;
}

.answers button:hover{
background:#ddd;
}

.result{
font-weight:700;
font-size:20px;
margin-top:15px;
min-height:28px;
}

.next{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:15px;
background:#4facfe;
color:white;
font-size:16px;
cursor:pointer;
}

.timer{
font-size:26px;
font-weight:700;
text-align:center;
margin-bottom:10px;
}

.level{
text-align:center;
font-weight:700;
margin-bottom:10px;
}

.finish{
text-align:center;
font-size:26px;
font-weight:700;
}
</style>
</head>

<body>

<div class="wrapper">

<h1>ЕГЭ ТРЕНАЖЁР</h1>

<div class="topbar">
<div class="badge">Баллы: <span id="score">0</span></div>
<div class="badge">Подряд: <span id="streak">0</span></div>
<div class="badge">Рекорд: <span id="record">0</span></div>
</div>

<div class="level">Уровень: <span id="level">Новичок</span></div>

<div class="timer">⏱ <span id="time">30</span></div>

<div class="progress">
<div class="progress-inner" id="progress"></div>
</div>

<div class="card" id="card">

<h2 id="question"></h2>

<div class="answers" id="answers"></div>

<div class="result" id="result"></div>

<button class="next" onclick="nextQuestion()">Следующий вопрос</button>

</div>

</div>

<script>

let score = Number(localStorage.getItem("score")) || 0
let record = Number(localStorage.getItem("record")) || 0
let streak = 0
let current = {}
let timer = 30
let interval

const questions = [

{q:"Какое свойство означает соответствие реальности?",
a:["Полнота","Достоверность","Актуальность","Понятность"],
c:1,
e:"Достоверность — соответствие реальности."},

{q:"Что является информацией?",
a:["37","Температура 37°C — опасно","Бит","Сигнал"],
c:1,
e:"Информация — осмысленные данные."},

{q:"Какой сигнал дискретный?",
a:["Музыка","Температура","Текст","Речь"],
c:2,
e:"Компьютер работает с дискретной информацией."},

{q:"Что не является носителем?",
a:["Бумага","Флешка","Свет","Мысль без записи"],
c:3,
e:"Информация всегда имеет материальный носитель."}

]

function setLevel(){
if(score<5) level.innerText="Новичок"
else if(score<10) level.innerText="Ученик"
else if(score<20) level.innerText="Эксперт"
else level.innerText="Мастер ЕГЭ"
}

function startTimer(){
timer=30
time.innerText=timer
interval=setInterval(()=>{
timer--
time.innerText=timer
if(timer===0){
clearInterval(interval)
showResult(false,"Время вышло")
}
},1000)
}

function loadQuestion(){

current = questions[Math.floor(Math.random()*questions.length)]

question.innerText=current.q
answers.innerHTML=""
result.innerText=""

current.a.forEach((text,i)=>{
const btn=document.createElement("button")
btn.innerText=text
btn.onclick=()=>answer(i)
answers.appendChild(btn)
})

startTimer()

}

function answer(i){

clearInterval(interval)

if(i===current.c){
score++
streak++
if(streak>record) record=streak
showResult(true,current.e)
}else{
streak=0
showResult(false,current.e)
}

localStorage.setItem("score",score)
localStorage.setItem("record",record)

updateUI()

}

function showResult(ok,text){

result.innerText=(ok?"✅ ":"❌ ")+text

progress.style.width=Math.min(score*5,100)+"%"

}

function nextQuestion(){
loadQuestion()
}

function updateUI(){
scoreEl.innerText=score
streakEl.innerText=streak
recordEl.innerText=record
setLevel()
}

const scoreEl=document.getElementById("score")
const streakEl=document.getElementById("streak")
const recordEl=document.getElementById("record")

updateUI()
loadQuestion()

</script>

</body>
</html>
