<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр ЕГЭ</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:linear-gradient(120deg,#eef3f9,#ffffff);
}

.wrapper{
max-width:1000px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
font-size:48px;
margin-bottom:10px;
}

.block{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.1);
margin-bottom:25px;
}

.scheme{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:#f4f7fb;
padding:20px;
border-radius:15px;
cursor:pointer;
transition:.3s;
text-align:center;
font-weight:600;
}

.card:hover{
background:#4facfe;
color:white;
transform:translateY(-5px);
}

.hidden{
display:none;
}

.answers button{
width:100%;
margin:8px 0;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
background:#eef2f7;
}

.answers button:hover{
background:#dfe6ef;
}

.result{
font-weight:700;
margin-top:15px;
min-height:25px;
}

.next{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:12px;
background:#4facfe;
color:white;
font-size:16px;
cursor:pointer;
}

.topbar{
display:flex;
gap:15px;
justify-content:center;
margin-bottom:15px;
flex-wrap:wrap;
}

.badge{
background:#111;
color:white;
padding:8px 15px;
border-radius:20px;
font-weight:700;
}

.progress{
height:10px;
background:#ddd;
border-radius:10px;
overflow:hidden;
margin-bottom:20px;
}

.progress-inner{
height:100%;
width:0%;
background:linear-gradient(90deg,#4facfe,#00f2fe);
}

</style>
</head>

<body>

<div class="wrapper">

<h1>Тренажёр ЕГЭ</h1>

<!-- СХЕМА -->
<div class="block">

<h2>Теория (нажми и начни тренировку)</h2>

<div class="scheme">

<div class="card" onclick="startTrainer('info')">
Свойства информации
</div>

<div class="card" onclick="startTrainer('signals')">
Сигналы
</div>

<div class="card" onclick="startTrainer('carrier')">
Носители информации
</div>

</div>

</div>


<!-- ТРЕНАЖЁР -->
<div class="block hidden" id="trainer">

<div class="topbar">
<div class="badge">Баллы: <span id="score">0</span></div>
<div class="badge">Подряд: <span id="streak">0</span></div>
</div>

<div class="progress">
<div class="progress-inner" id="progress"></div>
</div>

<h2 id="question"></h2>

<div class="answers" id="answers"></div>

<div class="result" id="result"></div>

<button class="next" onclick="nextQuestion()">Следующий вопрос</button>

</div>

</div>

<script>

let score=0
let streak=0
let currentTopic=""
let currentQuestion={}

const base={

info:[
{q:"Какое свойство означает соответствие реальности?",
a:["Полнота","Достоверность","Актуальность","Понятность"],
c:1,
e:"Достоверность — соответствие реальности."},

{q:"Что означает актуальность?",
a:["Полезность","Новизну","Своевременность","Точность"],
c:2,
e:"Актуальность — своевременность информации."}
],

signals:[
{q:"Какой сигнал дискретный?",
a:["Речь","Музыка","Текст","Температура"],
c:2,
e:"Текст — дискретный сигнал."},

{q:"Компьютер работает с:",
a:["Непрерывными сигналами","Дискретными сигналами"],
c:1,
e:"Компьютер — цифровое устройство."}
],

carrier:[
{q:"Что НЕ является носителем?",
a:["Флешка","Бумага","Свет","Мысль"],
c:3,
e:"Информация должна быть зафиксирована."},

{q:"Что является носителем?",
a:["Жёсткий диск","Звук без записи","Разговор"],
c:0,
e:"Жёсткий диск хранит информацию."}
]

}

function startTrainer(topic){

document.getElementById("trainer").classList.remove("hidden")

currentTopic=topic
score=0
streak=0
updateUI()
loadQuestion()

}

function loadQuestion(){

const arr=base[currentTopic]
currentQuestion=arr[Math.floor(Math.random()*arr.length)]

question.innerText=currentQuestion.q
answers.innerHTML=""
result.innerText=""

currentQuestion.a.forEach((t,i)=>{
const btn=document.createElement("button")
btn.innerText=t
btn.onclick=()=>answer(i)
answers.appendChild(btn)
})

}

function answer(i){

if(i===currentQuestion.c){
score++
streak++
showResult(true)
}else{
streak=0
showResult(false)
}

updateUI()

}

function showResult(ok){

result.innerText=(ok?"✅ ":"❌ ")+currentQuestion.e
progress.style.width=Math.min(score*10,100)+"%"

}

function nextQuestion(){
loadQuestion()
}

function updateUI(){
document.getElementById("score").innerText=score
document.getElementById("streak").innerText=streak
}

</script>

</body>
</html>
